name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # For the party store's tests (apps/server/src/store.test.ts).
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x # same as the Dockerfile
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run check
      - run: bun --filter @bye0/web build
