# bye0 and nidol (its matching service) as one Coolify resource.
#
# In Coolify: new resource from this repo, build pack "Docker Compose", then give the `web`
# service a domain. `server` and `nidol` get none: they are only reached over the internal network.

services:
  web:
    build:
      context: .
      target: web
    restart: unless-stopped

  server:
    build:
      context: .
      target: server
    environment:
      MATCHING_URL: http://nidol:8000
      # Where nidol localizes its searches (ISO 3166-1 alpha-2).
      MATCHING_COUNTRY: CL
    restart: unless-stopped

  nidol:
    # Built from nidol's own repo and Dockerfile; a redeploy picks up its latest main.
    build: https://github.com/Ofisalita/nidol.git#main
    restart: unless-stopped
